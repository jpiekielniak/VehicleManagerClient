<div class="user-details">
  <p-card>
    <ng-template pTemplate="header">
      <div class="card-header">
        <h2>Szczegóły konta</h2>

        <div class="menu-container">
          <div *ngIf="!state.isEditing">
            <p-menu
              #menu
              [model]="menuItems"
              [popup]="true"
              appendTo="body">
            </p-menu>
            <p-button
              icon="pi pi-ellipsis-v"
              (click)="menu.toggle($event)"
              styleClass="p-button-text">
            </p-button>
          </div>

          <div *ngIf="state.isEditing" class="edit-actions">
            <p-button
              icon="pi pi-check"
              label="Zapisz"
              (onClick)="onSubmit()"
              [loading]="state.isSubmitting"
              [disabled]="state.isSubmitting">
            </p-button>
            <p-button
              icon="pi pi-times"
              label="Anuluj"
              (onClick)="cancelEdit()"
              [disabled]="state.isSubmitting"
              styleClass="p-button-outlined p-button-secondary">
            </p-button>
          </div>
        </div>
      </div>
    </ng-template>

    <div class="card-content">
      <p-progressSpinner *ngIf="state.isLoading"></p-progressSpinner>

      <div *ngIf="state.error" class="error-message">
        {{ state.error }}
      </div>

      <div *ngIf="!state.isLoading && !state.error">
        <div *ngIf="!state.isEditing" class="view-mode">
          <div class="info-grid">
            <div class="info-item">
              <label><i class="pi pi-envelope"></i> Email</label>
              <div class="info-value">{{ state.userDetails?.email }}</div>
            </div>
            <div class="info-item">
              <label><i class="pi pi-user"></i> Imię</label>
              <div class="info-value">{{ state.userDetails?.firstName || '-' }}</div>
            </div>
            <div class="info-item">
              <label><i class="pi pi-user"></i> Nazwisko</label>
              <div class="info-value">{{ state.userDetails?.lastName || '-' }}</div>
            </div>
            <div class="info-item">
              <label><i class="pi pi-phone"></i> Numer telefonu</label>
              <div class="info-value">{{ state.userDetails?.phoneNumber || '-' }}</div>
            </div>
            <div class="info-item">
              <label><i class="pi pi-users"></i> Rola</label>
              <div class="info-value">{{ state.userDetails?.role }}</div>
            </div>
            <div class="info-item">
              <label><i class="pi pi-calendar"></i> Utworzono</label>
              <div class="info-value">{{ state.userDetails?.createdAt | date:'dd.MM.yyyy' }}</div>
            </div>
          </div>
        </div>

        <form *ngIf="state.isEditing" #editForm="ngForm" class="edit-mode">
          <div class="form-grid">
            <div class="form-field">
              <label>Imię</label>
              <input
                pInputText
                type="text"
                name="firstName"
                [(ngModel)]="state.editedUser.firstName"
                [disabled]="state.isSubmitting">
            </div>
            <div class="form-field">
              <label>Nazwisko</label>
              <input
                pInputText
                type="text"
                name="lastName"
                [(ngModel)]="state.editedUser.lastName"
                [disabled]="state.isSubmitting">
            </div>
            <div class="form-field">
              <label>Numer telefonu</label>
              <p-inputMask
                mask="999-999-999"
                name="phoneNumber"
                [(ngModel)]="state.editedUser.phoneNumber"
                [disabled]="state.isSubmitting">
              </p-inputMask>
            </div>
          </div>
        </form>
      </div>
    </div>
  </p-card>
</div>
