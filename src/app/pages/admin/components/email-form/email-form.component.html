<div class="notification-form-container">
  <div class="notification-form-header">
    <div class="header-icon">
      <i class="pi pi-envelope"></i>
    </div>
    <h2>Wyślij powiadomienie</h2>
  </div>

  <form [formGroup]="emailForm" (ngSubmit)="onSubmit()" class="notification-form">
    <div class="form-group">
      <label class="form-label">Temat wiadomości</label>
      <div class="input-wrapper subject-input-wrapper">
            <span class="p-input-icon-left w-full">
              <i class="pi pi-tag"></i>
              <input
                type="text"
                pInputText
                formControlName="title"
                placeholder="Wprowadź temat wiadomości"
                class="form-input subject-input"
                [class.error]="emailForm.get('title')?.invalid && emailForm.get('title')?.touched"
              />
            </span>
        <div
          @fadeSlide
          *ngIf="emailForm.get('title')?.invalid && emailForm.get('title')?.touched"
          class="error-message"
        >
          <i class="pi pi-exclamation-circle"></i>
          Temat jest wymagany
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Treść wiadomości</label>
      <div class="input-wrapper">
            <textarea
              pInputTextarea
              formControlName="content"
              [rows]="8"
              placeholder="Wprowadź treść wiadomości..."
              class="form-textarea"
              [class.error]="emailForm.get('content')?.invalid && emailForm.get('content')?.touched"
            ></textarea>
        <div
          @fadeSlide
          *ngIf="emailForm.get('content')?.invalid && emailForm.get('content')?.touched"
          class="error-message"
        >
          <i class="pi pi-exclamation-circle"></i>
          Treść wiadomości jest wymagana
        </div>
      </div>
    </div>

    <div class="form-warning">
      <p-message
        severity="info"
        text="Wiadomość zostanie wysłana do wszystkich użytkowników systemu"
        styleClass="warning-message"
      ></p-message>
    </div>

    <div class="form-actions">
      <button
        pButton
        type="submit"
        [disabled]="emailForm.invalid || sending"
        class="submit-button p-button-raised"
      >
        <i [class]="sending ? 'pi pi-spinner pi-spin' : 'pi pi-send'"></i>
        <span>{{ sending ? 'Wysyłanie...' : 'Wyślij wiadomość' }}</span>
      </button>
    </div>
  </form>
</div>
