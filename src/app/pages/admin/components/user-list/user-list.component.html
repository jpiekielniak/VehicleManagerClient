<div class="card">
  <div class="flex mb-8 gap-3">
        <span class="p-input-icon-left flex-grow-1">
          <i class="pi pi-search"></i>
          <input
            pInputText
            [(ngModel)]="searchEmail"
            (ngModelChange)="onSearchChange()"
            placeholder="Wyszukaj po adresie email"
            class="w-full py-3 px-4"
            style="font-size: 0.95rem; padding-left: 2.5rem; width:240px;"
          />
        </span>
  </div>

  <p-table
    [value]="users"
    [loading]="loading"
    styleClass="p-datatable-striped p-datatable-gridlines p-datatable-sm centered-table"
    [tableStyle]="{ 'min-width': '50rem', 'margin-top': '2rem' }"
    [paginator]="false"
    [rowHover]="true"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th class="text-center" style="width: 40%">
          <div class="flex align-items-center justify-content-center">
            <i class="pi pi-envelope mr-2"></i>
            Email
          </div>
        </th>
        <th class="text-center" style="width: 20%">
          <div class="flex align-items-center justify-content-center">
            <i class="pi pi-user mr-2"></i>
            Rola
          </div>
        </th>
        <th class="text-center" style="width: 25%">
          <div class="flex align-items-center justify-content-center">
            <i class="pi pi-calendar mr-2"></i>
            Data utworzenia
          </div>
        </th>
        <th class="text-center" style="width: 15%">
          <div class="flex align-items-center justify-content-center">
            <i class="pi pi-cog mr-2"></i>
            Akcje
          </div>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>
          <div class="flex align-items-center justify-content-center h-full">
            <span class="font-medium">{{user.email}}</span>
          </div>
        </td>
        <td>
          <div class="flex align-items-center justify-content-center h-full">
            <p-tag
              [value]="user.role"
              [severity]="user.role === 'Admin' ? 'danger' : 'info'"
            ></p-tag>
          </div>
        </td>
        <td>
          <div class="flex align-items-center justify-content-center h-full">
            <span class="text-sm">{{user.createdAt | date:'dd.MM.YYYY HH:mm'}}</span>
          </div>
        </td>
        <td>
          <div class="flex align-items-center justify-content-center h-full">
            <button
              pButton
              pRipple
              icon="pi pi-trash"
              class="p-button-rounded p-button-danger p-button-outlined"
              (click)="onDeleteUser(user)"
              pTooltip="Usuń użytkownika"
              tooltipPosition="left"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="loadingbody">
      <tr>
        <td colspan="4">
          <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-spin pi-spinner mr-2"></i>
            Ładowanie danych...
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">
          <div class="flex align-items-center justify-content-center p-4">
            <i class="pi pi-exclamation-circle mr-2 text-yellow-600"></i>
            Brak użytkowników do wyświetlenia
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="paginator-container mt-6">
    <app-pagination
      [first]="paginationService.getCurrentState().pageIndex * paginationService.getCurrentState().pageSize"
      [rows]="paginationService.getCurrentState().pageSize"
      [totalRecords]="totalItems"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
