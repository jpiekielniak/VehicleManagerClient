<div class="users-container">
  <div class="header-section">
    <div class="search-container">
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input
              pInputText
              [(ngModel)]="searchEmail"
              (ngModelChange)="onSearchChange()"
              placeholder="Wyszukaj po adresie email"
              class="search-input"
            />
          </span>
    </div>
  </div>

  <p-table
    [value]="users"
    [loading]="loading"
    styleClass="users-table"
    [tableStyle]="{ width: '100%' }"
    [paginator]="false"
    [rowHover]="true"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>
          <div class="header-cell">
            <i class="pi pi-envelope"></i>
            <span>Email</span>
          </div>
        </th>
        <th>
          <div class="header-cell">
            <i class="pi pi-user"></i>
            <span>Rola</span>
          </div>
        </th>
        <th>
          <div class="header-cell">
            <i class="pi pi-calendar"></i>
            <span>Data utworzenia</span>
          </div>
        </th>
        <th>
          <div class="header-cell">
            <i class="pi pi-cog"></i>
            <span>Akcje</span>
          </div>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>
          <div class="user-cell">
            <span class="user-email">{{user.email}}</span>
          </div>
        </td>
        <td>
          <div class="user-cell">
            <p-tag
              [value]="user.role"
              [severity]="user.role === 'Admin' ? 'danger' : 'info'"
              [rounded]="true"
            ></p-tag>
          </div>
        </td>
        <td>
          <div class="user-cell">
            <span class="date-text">{{user.createdAt | date:'dd.MM.YYYY HH:mm'}}</span>
          </div>
        </td>
        <td>
          <div class="user-cell">
            <button
              pButton
              pRipple
              icon="pi pi-trash"
              class="delete-button"
              (click)="onDeleteUser(user)"
              pTooltip="Usuń użytkownika"
              tooltipPosition="left"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="loadingbody">
      <tr>
        <td colspan="4">
          <div class="loading-message">
            <i class="pi pi-spin pi-spinner"></i>
            <span>Ładowanie danych...</span>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">
          <div class="empty-message">
            <i class="pi pi-exclamation-circle"></i>
            <span>Brak użytkowników do wyświetlenia</span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="pagination-container">
    <app-pagination
      [first]="paginationService.getCurrentState().pageIndex * paginationService.getCurrentState().pageSize"
      [rows]="paginationService.getCurrentState().pageSize"
      [totalRecords]="totalItems"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
