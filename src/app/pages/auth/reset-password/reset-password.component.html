<div class="auth-container">
  <div class="auth-card">
    <div class="auth-image-section">
      <div class="overlay"></div>
      <div class="welcome-text">
        <h1>Przypomnienie hasła</h1>
        <p>Wprowadź swój adres email, aby otrzymać link do resetowania hasła.</p>
      </div>
    </div>

    <div class="auth-form-section">
      <div class="auth-form-header">
        <h2>Przypomnij hasło <span class="wave">🔑</span></h2>
      </div>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-field-wrapper">
          <span class="p-float-label">
            <input
              id="email"
              type="email"
              pInputText
              formControlName="email"
              [style]="{ width: '100%' }"
            />
            <label for="email">Email</label>
          </span>
          <small class="error-message" *ngIf="isFieldInvalid('email')">
            {{ getControlError('email') }}
          </small>
        </div>

        <button
          pButton
          type="submit"
          [loading]="isLoading()"
          [disabled]="resetPasswordForm.invalid || isLoading()"
          label="Wyślij link"
          class="submit-button"
        ></button>

        <div class="auth-footer">
          <a [routerLink]="'/logowanie'" class="back-to-login">Wróć do logowania</a>
        </div>
      </form>
    </div>
  </div>
</div>
