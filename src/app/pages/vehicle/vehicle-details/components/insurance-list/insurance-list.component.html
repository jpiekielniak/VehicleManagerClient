<ng-container (click)="loadInsurances()">
  <div class="record-list" *ngIf="!state.isLoading && state.insurances.length > 0; else noInsurances">
    <div *ngFor="let insurance of state.insurances" class="record-item">
      <span class="record-title">{{ insurance.title }}</span>
      <div class="record-actions">
        <p-button
          icon="pi pi-eye"
          styleClass="p-button-rounded p-button-text"
          (onClick)="openInsuranceDetails(insurance.insuranceId)"
          pTooltip="Zobacz szczegóły">
        </p-button>
        <p-button
          icon="pi pi-trash"
          styleClass="p-button-rounded p-button-text p-button-danger"
          (onClick)="confirmInsuranceDelete(insurance.insuranceId)"
          pTooltip="Usuń ubezpieczenie">
        </p-button>
      </div>
    </div>
  </div>
  <ng-template #noInsurances>
    <p class="no-data">Brak aktywnych ubezpieczeń</p>
  </ng-template>
  <div class="button-container">
    <button
      pButton
      class="add-button"
      (click)="addInsurance()"
    >
      <div class="btn-content">
        <i class="pi pi-plus plus-icon"></i>
        <span class="btn-label">Dodaj ubezpieczenie</span>
      </div>
    </button>
  </div>
</ng-container>
<div *ngIf="state.isLoading" class="loading-state">
  <app-loading-spinner></app-loading-spinner>
</div>
