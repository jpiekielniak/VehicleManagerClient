<div class="insurance-details">
  <p-card styleClass="insurance-card">
    <ng-container *ngIf="!state.loading; else loadingTpl">
      <div class="header">
        <h2 class="title">{{ state.details?.title }}</h2>
        <div class="status-badge" [ngClass]="{ 'active': isInsuranceActive(), 'expired': !isInsuranceActive() }">
          {{ isInsuranceActive() ? 'Aktywne' : 'Nieaktywne' }}
        </div>
        <p-divider></p-divider>
      </div>

      <div class="content">
        <div class="info-field">
          <label>Ubezpieczyciel</label>
          <div class="info-value">
            {{ state.details?.provider }}
          </div>
        </div>

        <div class="info-field">
          <label>Numer polisy</label>
          <div class="info-value policy-number">
            {{ state.details?.policyNumber }}
          </div>
        </div>

        <div class="info-row">
          <div class="info-field">
            <label>Data rozpoczęcia</label>
            <div class="info-value">
              {{ state.details?.validFrom | date:'dd.MM.yyyy' }}
            </div>
          </div>

          <div class="info-field">
            <label>Data zakończenia</label>
            <div class="info-value" [ngClass]="{ 'text-danger': !isInsuranceActive() }">
              {{ state.details?.validTo | date:'dd.MM.yyyy' }}
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <p-divider></p-divider>
        <div class="actions">
          <p-button
            label="Zamknij"
            icon="pi pi-times"
            styleClass="p-button-outlined"
            (onClick)="close()">
          </p-button>
        </div>
      </div>
    </ng-container>

    <ng-template #loadingTpl>
      <app-loading-spinner></app-loading-spinner>
    </ng-template>
  </p-card>
</div>
