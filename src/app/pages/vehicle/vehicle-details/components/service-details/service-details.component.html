<div class="service-details">
  <h2 class="dialog-title">{{ serviceDetails?.title }}</h2>

  <div class="content-wrapper">
    <div class="info-section">
      <p-card styleClass="mb-3">
        <div class="info-field">
          <label>Data</label>
          <div class="info-value">{{ serviceDetails?.date | date:'dd.MM.yyyy' }}</div>
        </div>

        <div class="info-field">
          <label>Opis</label>
          <div class="info-value description">{{ serviceDetails?.description || 'Brak szczegółowego opisu' }}</div>
        </div>
      </p-card>
    </div>

    <div class="costs-section">
      <h3>Koszty</h3>
      <p-table [value]="serviceDetails?.costs || []" class="costs-table" [showCurrentPageReport]="false"
               *ngIf="serviceDetails?.costs?.length > 0; else noCosts">
        <ng-template pTemplate="header">
          <tr>
            <th>Tytuł</th>
            <th class="text-right">Kwota</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-cost>
          <tr>
            <td>{{ cost?.title }}</td>
            <td class="text-right">{{ cost?.amount }} PLN</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="footer">
          <tr>
            <td><strong>Suma kosztów</strong></td>
            <td class="text-right">
              <strong>{{ serviceDetails?.costs | sumBy: 'amount' }} PLN</strong>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <ng-template #noCosts>
        <p-message severity="info" text="Brak zarejestrowanych kosztów" class="w-full"></p-message>
      </ng-template>
    </div>
  </div>

  <div class="dialog-footer">
    <p-button label="Zamknij" (onClick)="close()" class="p-button-outlined"></p-button>
  </div>
</div>
