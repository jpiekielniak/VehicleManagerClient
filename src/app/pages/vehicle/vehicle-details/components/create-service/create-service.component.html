<div class="service-form">
  <form [formGroup]="createServiceForm" (ngSubmit)="onSubmit()" class="service-form__container">
    <div class="form-section">
      <h2>Dodaj nowy serwis</h2>
      <div class="form-field">
        <span class="float-label">
          <input
            type="text"
            id="title"
            formControlName="title"
            class="input-field"
            [ngClass]="{'error': isFieldInvalid('title')}"
            placeholder=" ">
          <label for="title">Tytuł serwisu 📝</label>
        </span>
        <small class="error-text" *ngIf="isFieldInvalid('title')">
          {{ getControlError('title') }}
        </small>
      </div>

      <div class="form-field">
        <span class="float-label">
          <textarea
            id="description"
            formControlName="description"
            class="input-field textarea"
            [ngClass]="{'error': isFieldInvalid('description')}"
            rows="3"
            placeholder=" "></textarea>
          <label for="description">Opis serwisu 📄</label>
        </span>
        <small class="error-text" *ngIf="isFieldInvalid('description')">
          {{ getControlError('description') }}
        </small>
      </div>

      <div class="form-field">
        <span class="p-float-label">
          <p-calendar
            id="date"
            formControlName="date"
            [showIcon]="true"
            dateFormat="dd.mm.yy"
            [touchUI]="true"
            [readonlyInput]="true"
            [locale]="pl"
            [showButtonBar]="true"
            [ngClass]="{'error': isFieldInvalid('date')}">
          </p-calendar>
          <label for="date">Data wykonania</label>
        </span>
        <small class="error-text" *ngIf="isFieldInvalid('date')">
          {{ getControlError('date') }}
        </small>
      </div>
    </div>

    <div class="costs-card">
      <div class="costs-header">
        <h3>Koszty serwisu 💰</h3>
        <span class="total-cost">Suma: {{ formatCurrency(formState$.getValue().totalCost) }}</span>
      </div>

      <div class="costs-container" formArrayName="costs">
        <div *ngFor="let cost of costs.controls; let i = index" [formGroupName]="i" class="cost-item">
          <div class="cost-grid">
            <div class="cost-field">
              <span class="p-float-label">
                <input
                  pInputText
                  type="text"
                  formControlName="title"
                  [ngClass]="{'ng-invalid ng-dirty': validateCostControl(i, 'title', 'required')}">
                <label>Tytuł kosztu</label>
              </span>
              <small class="error-text" *ngIf="validateCostControl(i, 'title', 'required')">
                Tytuł kosztu jest wymagany
              </small>
            </div>

            <div class="cost-field">
              <span class="p-float-label">
                <p-inputNumber
                  formControlName="amount"
                  mode="decimal"
                  [minFractionDigits]="2"
                  [maxFractionDigits]="2"
                  [suffix]="' PLN'"
                  [ngClass]="{'ng-invalid ng-dirty': validateCostControl(i, 'amount', 'required')}">
                </p-inputNumber>
                <label>Kwota</label>
              </span>
              <small class="error-text" *ngIf="validateCostControl(i, 'amount', 'required')">
                Kwota jest wymagana
              </small>
            </div>

            <button
              pButton
              type="button"
              icon="pi pi-trash"
              class="p-button-danger p-button-text"
              (click)="removeCost(i)">
            </button>
          </div>
        </div>

        <button
          pButton
          type="button"
          icon="pi pi-plus"
          label="Dodaj koszt"
          (click)="addCost()"
          class="p-button-outlined p-button-secondary mt-3 add-cost-btn">
        </button>
      </div>
    </div>

    <p-divider></p-divider>

    <div class="button-group">
      <button
        pButton
        type="button"
        label="Anuluj"
        icon="pi pi-times"
        class="p-button-secondary"
        (click)="close()">
      </button>
      <button
        pButton
        type="reset"
        label="Wyczyść"
        icon="pi pi-refresh"
        class="p-button-secondary"
        (click)="resetForm()">
      </button>
      <button
        pButton
        type="submit"
        label="Dodaj nowy serwis"
        icon="pi pi-check"
        [disabled]="!isFormValid()">
      </button>
    </div>
  </form>
</div>
