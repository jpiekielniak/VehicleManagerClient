<div class="service-form-container">
  <form [formGroup]="createServiceForm" (ngSubmit)="onSubmit()" class="service-form">
    <div class="form-header">
      <h2>Nowy serwis</h2>
      <p-divider></p-divider>
    </div>

    <div class="form-content">
      <div class="form-section">
        <h3>Podstawowe informacje</h3>

        <div class="form-group">
          <label for="title">Tytuł serwisu*</label>
          <input pInputText
                 id="title"
                 formControlName="title"
                 [ngClass]="{'ng-invalid ng-dirty': isFieldInvalid('title')}"
                 placeholder="Wprowadź tytuł serwisu">
          <small class="error-message" *ngIf="isFieldInvalid('title')">
            {{ getControlError('title') }}
          </small>
        </div>

        <div class="form-group">
          <label for="date">Data serwisu*</label>
          <p-calendar id="date"
                      formControlName="date"
                      [showIcon]="true"
                      [ngClass]="{'ng-invalid ng-dirty': isFieldInvalid('date')}"
                      dateFormat="dd.mm.yy"
                      [style]="{'width':'100%'}"
                      placeholder="Wybierz datę">
          </p-calendar>
          <small class="error-message" *ngIf="isFieldInvalid('date')">
            {{ getControlError('date') }}
          </small>
        </div>

        <div class="form-group">
          <label for="description">Opis serwisu*</label>
          <textarea pInputTextarea
                    id="description"
                    formControlName="description"
                    [ngClass]="{'ng-invalid ng-dirty': isFieldInvalid('description')}"
                    [rows]="3"
                    placeholder="Wprowadź opis serwisu">
          </textarea>
          <small class="error-message" *ngIf="isFieldInvalid('description')">
            {{ getControlError('description') }}
          </small>
        </div>
      </div>

      <div class="form-section">
        <div class="costs-header">
          <h3>Lista kosztów</h3>
          <button pButton
                  type="button"
                  icon="pi pi-plus"
                  (click)="addCost()"
                  class="p-button-rounded p-button-outlined">
          </button>
        </div>

        <div formArrayName="costs" class="costs-list">
          <div *ngFor="let cost of costs.controls; let i = index"
               [formGroupName]="i"
               class="cost-item">
            <div class="cost-item-content">
              <div class="cost-title">
                <input pInputText
                       formControlName="title"
                       placeholder="Nazwa usługi"
                       [ngClass]="{'ng-invalid ng-dirty': validateCostControl(i, 'title', 'required')}">
                <small class="error-message" *ngIf="validateCostControl(i, 'title', 'required')">
                  Nazwa jest wymagana
                </small>
              </div>

              <div class="cost-amount">
                <p-inputNumber formControlName="amount"
                               mode="currency"
                               currency="PLN"
                               locale="pl-PL"
                               [minFractionDigits]="2"
                               placeholder="0,00 PLN"
                               [ngClass]="{'ng-invalid ng-dirty': validateCostControl(i, 'amount', 'required')}">
                </p-inputNumber>
                <small class="error-message" *ngIf="validateCostControl(i, 'amount', 'required')">
                  Kwota jest wymagana
                </small>
              </div>

              <button pButton
                      type="button"
                      icon="pi pi-trash"
                      class="p-button-rounded p-button-danger p-button-outlined"
                      (click)="removeCost(i)">
              </button>
            </div>
          </div>
        </div>

        <div class="total-cost" *ngIf="(formState$ | async)?.totalCost">
          <span class="total-label">Łączny koszt:</span>
          <span class="total-amount">{{ formatCurrency((formState$ | async)?.totalCost || 0) }}</span>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button pButton
              type="button"
              label="Anuluj"
              class="p-button-outlined"
              (click)="close()">
      </button>
      <button pButton
              type="submit"
              label="Zapisz"
              [loading]="isSubmitting"
              [disabled]="!isFormValid() || (formState$ | async)?.isSubmitting">
      </button>
    </div>
  </form>
</div>
