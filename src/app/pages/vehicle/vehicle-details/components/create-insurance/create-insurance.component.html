<div class="create-insurance">
  <form [formGroup]="createInsuranceForm" (ngSubmit)="onSubmit()" class="insurance-form">
    <p-card styleClass="form-card">
      <div class="form-content">
        <div class="form-field">
          <label for="title">Nazwa ubezpieczenia</label>
          <input
            id="title"
            type="text"
            pInputText
            formControlName="title"
            [class.ng-invalid]="isFieldInvalid('title')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('title')">
            {{ getErrorMessage('title') }}
          </small>
        </div>

        <div class="form-field">
          <label for="provider">Ubezpieczyciel</label>
          <input
            id="provider"
            type="text"
            pInputText
            formControlName="provider"
            [class.ng-invalid]="isFieldInvalid('provider')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('provider')">
            {{ getErrorMessage('provider') }}
          </small>
        </div>

        <div class="form-field">
          <label for="policyNumber">Numer polisy</label>
          <input
            id="policyNumber"
            type="text"
            pInputText
            formControlName="policyNumber"
            [class.ng-invalid]="isFieldInvalid('policyNumber')"
          />
          <small class="error-message" *ngIf="isFieldInvalid('policyNumber')">
            {{ getErrorMessage('policyNumber') }}
          </small>
        </div>

        <div class="dates-row">
          <div class="form-field">
            <label for="validFrom">Data rozpoczęcia</label>
            <p-calendar
              id="validFrom"
              formControlName="validFrom"
              [showIcon]="true"
              [touchUI]="true"
              [readonlyInput]="true"
              [locale]="pl"
              [showButtonBar]="true"
              [class.ng-invalid]="isFieldInvalid('validFrom')"
            ></p-calendar>
            <small class="error-message" *ngIf="isFieldInvalid('validFrom')">
              {{ getErrorMessage('validFrom') }}
            </small>
          </div>

          <div class="form-field">
            <label for="validTo">Data zakończenia</label>
            <p-calendar
              id="validTo"
              formControlName="validTo"
              [minDate]="minDate"
              [showIcon]="true"
              [touchUI]="true"
              [readonlyInput]="true"
              [locale]="pl"
              [showButtonBar]="true"
              [class.ng-invalid]="isFieldInvalid('validTo') || state.dateError"
            ></p-calendar>
            <small class="error-message" *ngIf="isFieldInvalid('validTo') || state.dateError">
              {{ getErrorMessage('validTo') }}
            </small>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <p-button
          type="submit"
          [label]="state.isSubmitting ? 'Zapisywanie...' : 'Zapisz'"
          [disabled]="!createInsuranceForm.valid || state.isSubmitting || state.dateError"
          styleClass="p-button-primary"
          [loading]="state.isSubmitting"
        ></p-button>
      </div>
    </p-card>
  </form>
</div>
