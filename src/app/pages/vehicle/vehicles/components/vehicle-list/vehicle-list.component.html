<div class="container">
  <div class="vehicle" *ngFor="let vehicle of vehicles; let i = index">
    <div class="frame-1">
      <div class="frame-2">
        <div class="frame-3">
          <div class="vehicle-position">
            <span class="span-01">{{ i + 1 }}</span>
          </div>
          <span class="span-brand">{{ vehicle.brand }}</span>
          <span class="span-area">
            {{ vehicle.model }}
          </span>
        </div>
        <button class="button" (click)="onNavigateToDetails(vehicle.vehicleId)">
          <span class="span-view-vehicle">Zobacz więcej</span>
        </button>
      </div>
      <div class="image"
           [style.backgroundImage]="'url(/assets/default-vehicle.png)'">
      </div>
    </div>
  </div>
</div>
