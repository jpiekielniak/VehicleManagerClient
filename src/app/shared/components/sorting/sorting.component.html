<div class="sort-container">
  <p-dropdown
    [options]="sortOptions"
    [(ngModel)]="selectedSortOption"
    [placeholder]="placeholder"
    (onChange)="onSortChange()"
    styleClass="sort-dropdown"
  >
    <ng-template pTemplate="selectedItem">
      <div class="selected-item">
        <i [class]="iconClass"></i>
        <span>{{ getSortOptionLabel(selectedSortOption) || placeholder }}</span>
      </div>
    </ng-template>
  </p-dropdown>

  <button
    pButton
    type="button"
    class="sort-direction-btn"
    (click)="toggleSortDirection()"
    [pTooltip]="sortDirection === 'asc' ? 'Sortowanie rosnące' : 'Sortowanie malejące'"
  >
    <i class="pi"
       [ngClass]="{
             'pi-sort-up': sortDirection === 'asc',
             'pi-sort-down': sortDirection === 'desc'
           }">
    </i>
  </button>
</div>
